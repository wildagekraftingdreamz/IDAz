name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: Store tests
        run: npm test

      # The smoke test drives a real Electron window, so it needs a display.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: UI smoke test
        env:
          IDAZ_SMOKE: '1'
          IDAZ_SMOKE_OUT: ${{ runner.temp }}/idaz-smoke.json
        run: |
          set -euo pipefail
          timeout 180 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            npx electron . --demo --no-sandbox
          node scripts/check-smoke.mjs "$IDAZ_SMOKE_OUT"
